<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Tu Video - Mentiras</title>
    <style>
        /* FUENTES */
        @font-face {
            font-family: 'BanamexDisplayBold';
            src: url("{{ url_for('static', filename='fonts/BanamexDisplay-Bold.otf') }}") format('opentype');
            font-weight: 700;
        }
        @font-face {
            font-family: 'BanamexDisplay';
            src: url("{{ url_for('static', filename='fonts/BanamexDisplay-Regular.otf') }}") format('opentype');
            font-weight: 400;
        }
        @font-face {
            font-family: 'BanamexText';
            src: url("{{ url_for('static', filename='fonts/BanamexText-Regular.otf') }}") format('opentype');
            font-weight: 400;
        }

        body {
            font-family: 'BanamexText', system-ui, sans-serif;
            background-color: #0f4650; /* Color Banamex */
            color: white;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        h2 { margin-bottom: 20px; font-family: 'BanamexDisplayBold'; font-weight: 300; letter-spacing: 1px; text-align: center; }

        .video-container {
            width: 100%;
            max-width: 350px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            margin-bottom: 30px;
            background: #000;
        }

        video { width: 100%; display: block; }

        .actions {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 300px;
        }

        /* ESTILOS DE BOTONES (Copiados de preview.html) */
        .btn, .btn_red {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 60px;
            padding: 0 22px;
            border: 0;
            border-radius: 14px;
            text-decoration: none;
            cursor: pointer;
            font-family: 'BanamexDisplayBold', sans-serif; 
            font-size: 20px; /* Ajustado para móviles */
            transition: transform .2s ease, filter .2s ease;
            width: 100%; /* Full width en móvil */
            box-sizing: border-box;
        }

        /* Botón Rojo (Principal - Guardar) */
        .btn { 
            background: #FF1B44; 
            color: #FFFFFF; 
        }

        /* Botón Blanco (Secundario - Compartir) */
        .btn_red { 
            background: #FFFFFF; 
            color: #450a27; 
        }

        .btn:hover, .btn_red:hover { transform: translateY(-2px); filter: brightness(1.06); }
        .btn:active, .btn_red:active { transform: none; filter: brightness(.98); }

        .footer { margin-top: 40px; font-size: 12px; color: rgba(255,255,255,0.6); font-family: 'BanamexText'; }
    </style>
</head>
<body>

    <h2>¡Aquí tienes tu video!</h2>

    <div class="video-container">
        <video id="myVideo" controls autoplay playsinline loop muted>
            <source src="{{ result_url }}" type="video/mp4">
            Tu navegador no soporta video.
        </video>
    </div>

    <div class="actions">
        <!-- Guardar (Acción principal -> Rojo) -->
        <a href="{{ url_for('download_video', filename=filename) }}" class="btn">
            Guardar en Galería
        </a>

        <!-- Compartir (Acción secundaria -> Blanco) -->
        <button id="shareBtn" class="btn_red">
            Compartir Video
        </button>
    </div>

    <div class="footer">Tina Turner © 2025</div>

    <script>
        const shareBtn = document.getElementById('shareBtn');
        const videoUrl = "{{ result_url }}"; 
        const filename = "{{ filename }}";

        // Activar audio al tocar
        document.getElementById('myVideo').addEventListener('click', function() {
            this.muted = false;
        });

        shareBtn.addEventListener('click', async () => {
            const originalText = shareBtn.innerText;
            shareBtn.innerText = "Preparando...";
            
            try {
                const response = await fetch(videoUrl);
                const blob = await response.blob();
                const file = new File([blob], filename, { type: "video/mp4" });

                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    await navigator.share({
                        files: [file],
                        title: 'Video Mentiras',
                        text: '¡Mira mi video generado con IA!'
                    });
                } else {
                    alert("Usa el botón de Guardar para descargar el video.");
                }
            } catch (error) {
                console.log("Error al compartir:", error);
            } finally {
                shareBtn.innerText = originalText;
            }
        });
    </script>
</body>
</html>
